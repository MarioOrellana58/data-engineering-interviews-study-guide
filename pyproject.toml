[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "senior-data-engineer-interview-lab"
version = "0.1.0"
description = "Factored-focused senior data engineering interview exercises"
requires-python = ">=3.11"

[project.optional-dependencies]
study = [
  "duckdb>=1.1,<2",
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["basics", "intermediate", "advanced"]
python_files = ["test_*.py"]
addopts = "--strict-markers --import-mode=importlib"

[tool.setuptools]
py-modules = ["test_support"]
