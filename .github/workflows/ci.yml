name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install study dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[study]"

      - name: Compile Python files
        run: python -m compileall -q basics intermediate advanced test_support.py

      - name: Collect exercises
        run: python -m pytest --collect-only -q

      - name: Validate reference solutions
        env:
          STUDY_USE_SOLUTIONS: "1"
        run: python -m pytest -q
